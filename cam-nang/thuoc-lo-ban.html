<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra Cứu Thước Lỗ Ban Chuẩn Phong Thủy - Sơn Vũ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fffcf5; }
        .ruler-box { max-width: 500px; margin: auto; background: white; padding: 30px; border: 2px solid #8B0000; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 15px; font-size: 20px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 20px; }
        .result { font-size: 24px; font-weight: bold; color: #8B0000; padding: 20px; border-radius: 10px; background: #fff0f0; }
        h1 { color: #8B0000; font-size: 20px; }
        .btn-call { display: block; background: #8B0000; color: white; padding: 15px; text-decoration: none; margin-top: 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ruler-box">
        <h1>TRA CỨU KÍCH THƯỚC BAN THỜ</h1>
        <p>Nhập kích thước (cm) để xem cung tốt/xấu:</p>
        <input type="number" id="sizeInput" placeholder="Ví dụ: 127" oninput="checkRuler()">
        <div id="result" class="result">Chưa nhập số</div>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">* Thước 38.8cm dùng cho Đồ thờ, Biến cát thành hung.</p>
        <a href="tel:0936320832" class="btn-call">📞 GỌI NGHỆ NHÂN TƯ VẤN THÊM</a>
    </div>
    <script>
        function checkRuler() {
            let val = document.getElementById('sizeInput').value;
            let result = document.getElementById('result');
            if(!val) { result.innerText = "Chưa nhập số"; return; }
            // Logic đơn giản giả lập tra cứu các cung tốt như Tiến Bảo, Đăng Khoa, Hỷ Sự
            const luckySizes = [61, 67, 81, 89, 107, 127, 153, 175, 197];
            let isLucky = luckySizes.some(s => Math.abs(s - val) <= 2);
            if(isLucky) {
                result.innerText = "CUNG TỐT: ĐẠI CÁT 🧧";
                result.style.color = "green";
            } else {
                result.innerText = "CUNG XẤU: NÊN CHỈNH ⚠️";
                result.style.color = "red";
            }
        }
    </script>
    <p><br><a href="../index.html">← Quay lại Trang chủ</a></p>
</body>
</html>
