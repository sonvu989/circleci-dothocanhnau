<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhận Tài Liệu Phong Thủy & Ưu Đãi - Nghệ Nhân Sơn Vũ</title>
    <style>
        body { font-family: sans-serif; background: #fff5f5; text-align: center; padding: 50px 20px; }
        .form-box { background: white; padding: 40px; max-width: 500px; margin: auto; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #8B0000; }
        h1 { color: #8B0000; font-size: 24px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background: #8B0000; color: white; border: none; padding: 15px 30px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background: #a00000; }
    </style>
</head>
<body>
    <nav style="padding:10px; font-size:14px;"><a href="../index.html">Trang chủ</a> > <span style="color:#888;">Cẩm nang Đồ Thờ</span></nav>
    <div class="form-box">
        <h1>QUÀ TẶNG GIA CHỦ</h1>
        <p>Để lại thông tin để nhận ngay <strong>Bộ Văn Khấn Cổ Truyền</strong> và <strong>Voucher giảm giá 1.000.000đ</strong> khi đặt bàn thờ gỗ Gụ Lào.</p>
        
        <form action="https://formspree.io/f/YOUR_ID" method="POST">
            <input type="text" name="name" placeholder="Họ và tên gia chủ" required>
            <input type="tel" name="phone" placeholder="Số điện thoại Zalo" required>
            <input type="email" name="email" placeholder="Địa chỉ Email (nếu có)">
            <button type="submit" class="btn-submit">NHẬN QUÀ NGAY</button>
        </form>
        
        <p style="font-size: 12px; color: #888; margin-top: 20px;">* Chúng tôi cam kết bảo mật thông tin gia chủ tuyệt đối.</p>
    </div>
    <p><br><a href="../index.html">← Quay lại trang chủ</a></p>
</body>
</html>
